# Fleet monitor thresholds.
#
# THRESHOLDS ARE DATA. Editing this file and restarting the container changes the
# RAG boundaries; nothing here requires a rebuild. That is deliberate and matches
# how the transcode worker treats /mnt/state/transcode/config.
#
# Format: INI (stdlib configparser), not YAML -- see the docstring of
# app/thresholds.py for why. Every section is one check.
#
# Keys:
#   metric      the sample name this threshold applies to
#   unit        for display only
#   direction   high_is_good | low_is_good | range
#   green       the healthy boundary
#   amber       the edge of the amber band (red is beyond it)
#   target      cubox | storage | backup | fleet   (which group evaluates it)
#   note        why the number is what it is -- keep this filled in
#
# VALIDATION IS STRICT AND HAPPENS AT LOAD. A malformed boundary is a startup
# failure, not a check that quietly never fires. A silent check reads on the
# dashboard exactly like a healthy fleet, which is the failure this whole
# component exists to prevent.
#
# A NOTE ON WHAT IS *NOT* HERE: there is no temperature threshold that a CuBox
# can reach, because the board has no thermal zone at all -- `cooling_device0-2`
# exist but there is no /sys/class/thermal, and imx_thermal is not built. See the
# [temperature] section below, which exists so the absence is explicit on the
# dashboard rather than omitted: an omitted row reads as "fine".
#
# OPERATOR RULING (2026-09-26), which governs how temperature is modelled at all:
# the CuBoxes have NO ACTIVE COOLING, so a temperature reading is FYI -- there is
# nothing hardware, software or a human can do about it, and the boxes are
# expected to stay operative through 24/7 100% CPU/VPU load. So temperature is
# deliberately NOT a RAG metric and must never drive a remedy. Its one threshold
# is set at the SoC's rated limit, not at a comfortable one, so that a reading
# during legitimate full load can never be amber. See the [temperature] note.
#
# The general rule this is an instance of: a threshold on a value nobody can
# influence is a permanent alarm on a healthy fleet, and item 72 establishes that
# a permanent false alarm is worse than no check -- it teaches the operator to
# ignore the colour. Before adding a bound, ask which human action it implies.


# ---------------------------------------------------------------------------
# CuBoxes (.66, .67)
# ---------------------------------------------------------------------------

[failed_units]
metric = failed_units
unit = units
direction = low_is_good
green = 0
amber = 0
target = cubox
note = Item 36: six units once failed on every boot from one cause (a writable path on the read-only NFS root) and nothing reported it. Any failed unit is a real fault, so amber equals green.

[state_save_age_min]
metric = state_save_age_min
unit = min
direction = low_is_good
green = 20
amber = 40
target = cubox
note = cubox-state-save.timer fires every 15 min. 20 min allows one missed tick (a busy box); 40 min means two, which is not a scheduling jitter. Beyond that the silent-/mnt/state footgun is the first suspect. NOTE: an EMPTY LastTriggerUSec is legitimate for the first 10 minutes after any reboot (OnBootSec=10min) and must be reported UNKNOWN, not FAIL.

[shared_applied_lag_min]
metric = shared_applied_lag_min
unit = min
direction = low_is_good
green = 20
amber = 40
target = cubox
note = The lag graded here is NOT the box's staleness -- it is the AGE OF THE LAYER'S `current` POINTER, i.e. how long ago the fleet's generation was flipped, measured on Backup-NAS's own clock (both terms: the file's mtime and the NAS's `now`). A box that has not applied a generation activated five minutes ago is CONVERGING, not stuck: cubox-shared-apply.timer is OnUnitActiveSec=15min, so one timer tick is the designed convergence time. 20 min allows one tick plus jitter; 40 min means two ticks have passed, which is no longer scheduling. A threshold on the BOX's own clock would be meaningless here -- the boxes have no RTC, no NTP and boot months wrong (item 23). When the age cannot be computed at all (mtime unreadable, or in the future) the check reports UNKNOWN rather than failing, because that is the one input separating converging from stuck (item 76).

[pass_cadence_min]
metric = pass_cadence_min
unit = min
direction = low_is_good
green = 15
amber = 30
target = cubox
note = Measured cadence is 5 min when idle (IDLE_EMPTY=300) and ~20 h when a pass has work. This threshold is therefore ONLY meaningful when the box is idle, and the check says so. The liveness signal is the === pass start === LOG LINE, never run/<host>.last, which is written at pass END and is structurally stale (item 66). A SECOND gate excludes a deliberately stopped worker: while cubox-transcode.service reports unit_active_state=inactive the age below measures how long the box has been switched off, so it would cross green->amber->red on a box doing exactly as instructed -- and the deliberate stop is normal here, because the shared layer defers the transcode restart to a pass boundary. Only `inactive` is exempted; `failed` still grades, so a crash-loop cannot hide behind it.

[heartbeat_age_min]
metric = heartbeat_age_min
unit = min
direction = low_is_good
green = 225
amber = 240
target = cubox
note = DELIBERATELY LOOSE. A HEALTHY job may run to the wall-clock cap, 6 x source duration + 300 s; for this library's longest source (2100 s) that is 3 h 35 m. A tighter threshold is a PERMANENT FALSE FAIL, which item 72 establishes is worse than no check. This only catches a job wedged OUTSIDE ffmpeg; the precise detector is the worker's own stall_watch() (300 s of a frozen frame counter). ALSO: run/<host>.job is never cleared on completion, so its age must be compared against ExecMainStartTimestamp before it means anything -- measured 2026-09-26, cubox-1's heartbeat was 76 minutes older than its last pass start while jobs=0.
claim = IMPLEMENTED 2026-10-04, checks/cubox.py::JobHeartbeat. The two-sample comparison this claim used to require turned out NOT to be needed, and the claim was the thing that was wrong: it assumed running-ness had to be inferred from `.part` growth, but the pass lock answers that directly and exactly now that worker.sh takes it PER PASS (item 87, 2026-10-01) rather than once per process. So the gate is `pass_lock == held`, and the second fact added is `lock_mtime` -- lock_take() opens the lock with a truncate redirect, so its mtime IS the current pass start, and a heartbeat older than the lock belongs to the PREVIOUS pass and must not be graded (the 76-minute fiction in the note above). The .part ages are carried as EVIDENCE beside the graded heartbeat, not as a second threshold. Two other paths are deliberately UNKNOWN rather than graded: a pass in flight with no heartbeat yet, and a heartbeat the box's clock cannot age.

[mem_available_mb]
metric = mem_available_mb
unit = MB
direction = high_is_good
green = 600
amber = 300
target = cubox
note = 2 GB total, no swap. The measured peak for a transcode job is 127 MB, so 600 MB free is comfortable; below 300 MB the box is a candidate OOM victim and the things it can take down are sshd, the state-save timer, and the /etc tmpfs holding the box's identity.

[cma_free_mb]
metric = cma_free_mb
unit = MB
direction = high_is_good
green = 200
amber = 100
target = cubox
note = CMA is the VPU's pool: CmaTotal 262144 kB, CmaFree 256492 kB measured idle 2026-09-26. Item 70's experiment deadlocked the encoder at 16 capture buffers; CMA exhaustion is the visible symptom of that family. Only meaningful while IDLE, which the check states.

[tmpfs_used_pct]
metric = tmpfs_used_pct
unit = percent
direction = low_is_good
green = 60
amber = 85
target = cubox
note = /etc /tmp /var/tmp /var/log /build are RAM. A full /var/log silently costs journald; a full /build loses the native build scratch; a full /etc loses the box's identity on the next boot. Evaluated per-mount, worst-case reported.

[strikes]
metric = strikes
unit = files
direction = low_is_good
green = 0
amber = 2
target = cubox
note = Files at >=amber attempts WHOSE OUTPUT IS STILL MISSING. MAX_ATTEMPTS=3 retires a file, so amber=2 is the last point where a human can still intervene cheaply. THE OUTPUT TEST IS PART OF THE METRIC, NOT DECORATION: the strike ledger is append-only (skip_bump() is its only writer and nothing removes an entry), so a file that failed twice and then succeeded keeps its count forever. Measured 2026-09-26: three of cubox-1's four ledger entries were already published, including the 2-attempt one -- so a check that read the ledger directly would have been AMBER immediately and RED as soon as any file hit 3, on a fleet that is transcoding fine. That is a permanent false FAIL (item 72). When the output tree cannot be read this check is UNKNOWN, never the raw ledger count.

[temperature]
direction = low_is_good
green = 100
amber = 100
target = cubox
unavailable_reason = not available on this hardware -- the board has no thermal zone (no /sys/class/thermal, imx_thermal not built), so there is nothing to read. Stated explicitly rather than omitted, because an absent row reads as fine.
note = FYI ONLY -- THIS IS NOT A RAG METRIC AND MUST NEVER DRIVE A REMEDY. Operator ruling 2026-09-26: the CuBoxes have no active cooling, so there is nothing hardware, software or a human can do about a warm reading, and the boxes are expected to remain operative through 24/7 100% CPU/VPU load. Consequently there is NO AMBER BAND (amber == green == 100), because on a fanless board under legitimate full load the only honest states are "normal" and "something is wrong with the sensor or the SoC". A 70/85 band was written first and REJECTED for exactly that reason: it would sit amber on a healthy fleet the moment both boxes were busy, which is the permanent-false-alarm shape item 72 establishes is worse than no check. 100 C is the bound because the i.MX6Q's commercial junction maximum is 105 C -- a reading above it means thermal runaway or a broken sensor, never merely a busy box. This section began as `direction = high_is_good / green = 0`, satisfied by every possible temperature, i.e. a green that cannot be false (item 26); it is now a real bound so that IF a thermal zone ever appears the check becomes meaningful with no code change. MEASURED 2026-09-26 on both boxes: `thermal_zones 0`, `cooling_devices 3`, `thermal_mdeg` empty, so what renders today is the unavailable_reason above as UNKNOWN/grey -- never green, never red. Item 19: a naive `cat /sys/class/thermal/*/temp` would be a permanent false FAIL.


# ---------------------------------------------------------------------------
# Storage-NAS (.50) and TVH/DVB
# ---------------------------------------------------------------------------

[media_volume_used_pct]
metric = media_volume_used_pct
unit = percent
direction = low_is_good
green = 80
amber = 90
target = storage
note = ONE metric, TWO failures: /mnt/recordings and /mnt/transcoded are the SAME 770 GB filesystem, so a full volume stops recording AND transcoding at once. Measured 2026-09-26: 63% used, 283 GB free. This is a sharper RED than a generic disk check for exactly that reason.

[dvb_adapter_count]
metric = dvb_adapter_count
unit = adapters
direction = high_is_good
green = 2
amber = 1
target = storage
note = PRESENCE, not function. The Hauppauge WinTV-dualHD exposes /dev/dvb/adapter0 and adapter1, both with demux0/dvr0/frontend0/net0. Only proof a tuner WORKS is a real recording, which must never be run automatically (it consumes a tuner and fights TVH's schedule), so 'works' stays UNKNOWN when no recording has happened. Both adapters were measured tuning 2026-09-26 02:04-02:05 for EPG, so presence==2 is genuinely green today.

[epg_freshness_h]
metric = epg_freshness_h
unit = hours
direction = low_is_good
green = 6
amber = 24
target = storage
note = TVH snapshots the EPG DB hourly (:14:18, measured) and the EPG grabber runs on its own cycle. Stale EPG means the schedule is drifting, which is the precursor to missed recordings. A WARNING 'data completion timeout' from the grabber is a real, observed signature and is reported separately from staleness.

[tvh_tuner_refusal_h]
metric = tvh_tuner_refusal_h
unit = hours
direction = high_is_good
green = 24
amber = 6
target = storage
note = HOURS SINCE THE NEWEST TUNER REFUSAL, not a count -- and the direction is high_is_good because a RECENT failure is the bad end. The window is a 20000-line tail measured at TEN DAYS, so a count-based check would hold RED for ten days after one bad night (item 72). Measured 2026-09-25: 1330 'No input source available', 3 of them ending in 'Recording unable to start ... No input detected' -- Unelma-asunto auringon alta (MTV Ava, mux 514MHz), Vain elamaa (Nelonen, mux 562MHz) and Radion sinfoniaorkesterin konsertti (Yle Teema & Fem, mux 562MHz) -- and none before or after that day. NOTE the muxes: an earlier revision of this note said all three were on 562MHz and that is WRONG, MTV Ava is on 514MHz. The correction matters because 514MHz vs 562MHz is the whole cross-check -- the three failures spanned TWO muxes on ONE adapter, while the other adapter carried BOTH muxes the same evening. The chain is NOTICE -> WARNING -> ERROR and only the last line means a recording was actually lost. 'no free adapter', which this check originally tested for, has NEVER appeared on this fleet.

[tvh_tuner_silent_h]
metric = tvh_tuner_silent_h
unit = hours
direction = low_is_good
green = 24
amber = 48
target = storage
note = HOURS A TUNER HAS RECEIVED NOTHING WHILE BEING ASSIGNED WORK -- FEWER IS BETTER, hence low_is_good. (The sibling row tvh_tuner_refusal_h is high_is_good because it measures hours SINCE a fault; this one measures hours OF a fault, so the two directions are opposites despite both being "hours".) Graded per adapter, worst-case reported, and a tuner with NO assignments is UNKNOWN rather than green -- "nothing was asked of it" is not evidence of health. GREEN=24 h because TVH assigns each mux to one adapter per EPG cycle and this fleet's cycle is 12-hourly (measured 02:04 and 14:04), so a healthy tuner receives at least twice a day; 24 h tolerates one missed cycle and 48 h two, which is what keeps this from being a permanent false FAIL on a dual-tuner box where one adapter may legitimately idle. Measured 2026-09-26: tuner #0 last received 2026-09-17 14:04, then took 18 consecutive EPG grabs on 562MHz and received nothing from every one -- each held the mux ~605 s until the timeout, where a healthy grab releases it in ~61 s -- and wrote ZERO recording files across a ten-day window: 221 h silent, RED, dated to within 12 hours. Its sibling carried 562MHz AND 514MHz normally the same day, which is what scopes the fault to the adapter rather than to the aerial or the mux table.

[tvh_mux_unreachable]
metric = tvh_mux_unreachable
unit = muxes
direction = low_is_good
green = 0
amber = 0
target = storage
note = MUXES THAT FAILED WITH NO SUCCESSFUL RECEPTION ON ANY TUNER. This is the RESCAN branch of the RCA: when no tuner can carry a mux, the aerial, the signal or the DVB-T mux definition is the suspect. Deliberately a SEPARATE row from tvh_tuner_silent_h because the two need opposite remedies -- rebind the driver vs rescan the mux -- and collapsing them into one "DVB problem" is how an operator performs the wrong one and learns to ignore the colour. Amber equals green because a single unreachable mux is already the fault this row exists to name. It requires proof of a NEGATIVE (no carrier on any adapter), so any mux that some tuner carried is exonerated and never counted here; when there is no tuner fault at all it reports UNKNOWN rather than green, because nothing was asked.

[tvh_response_ms]
metric = tvh_response_ms
unit = ms
direction = low_is_good
green = 2000
amber = 5000
target = storage
note = TVH answers 401 because auth is on and the credentials are unknown (open decision 3). 401 IS AN ANSWER and is reported as unverifiable-but-alive, NEVER as failure -- `curl -f` would report permanent RED, and 'any HTTP code came back' would report permanent GREEN on a service that serves nothing.


# ---------------------------------------------------------------------------
# Backup-NAS (.60) -- the fleet's boot dependency
# ---------------------------------------------------------------------------

[backup_load1]
metric = backup_load1
unit = load
direction = low_is_good
green = 2.0
amber = 4.0
target = backup
note = ONE core. Measured 2026-09-26: load average 2.21, 57 MB free, 515 MB total RAM. This box is already saturated, which is the standing reason nothing new runs on it.

[backup_mem_available_mb]
metric = backup_mem_available_mb
unit = MB
direction = high_is_good
green = 200
amber = 100
target = backup
note = RE-CALIBRATED 2026-09-26, and the reason matters. Backup-NAS runs kernel 3.4.6, which predates MemAvailable (Linux 3.14) -- its /proc/meminfo has MemFree/Buffers/Cached and NO MemAvailable. So the metric is the pre-3.14 estimate MemFree+Buffers+Cached (parsers.mem_available_kb), which is what `free`'s "-/+ buffers/cache" column reports. Measured: MemFree 73272 + Buffers 96976 + Cached 110632 = 274 MB. The earlier green=120/amber=60 was fitted to a 57 MB reading that was a MemFree-style number, so against the estimate formula it was ~4x too loose -- a threshold fitted to a different quantity, which is this project's units-mismatch bug wearing a different costume (item 53). Recalibrated so amber still means "getting tight" on THIS formula. The estimate OVERSTATES availability because not all of Cached is reclaimable; the detail string says which formula produced the number, so a green here is never mistaken for a MemAvailable reading.

[backup_disk_free_gb]
metric = backup_disk_free_gb
unit = GB
direction = high_is_good
green = 30
amber = 10
target = backup
note = Holds the shared rootfs, the TFTP boot files, and every per-device state export (cubpxe is 2.8 GB). Running out stops the fleet booting, not just persisting.


# ---------------------------------------------------------------------------
# The transcode fleet -- the thing the fleet exists to do
# ---------------------------------------------------------------------------

[orphan_parts]
metric = orphan_parts
unit = files
direction = low_is_good
green = 0
amber = 5
target = fleet
note = ALERT ONLY, never auto-deleted. An orphaned .part is the only surviving evidence of a dead box's last job. The worker sweeps its OWN temps at every pass start (worker.sh:1092-1102) and does so per-host precisely so a peer's in-flight file can never be touched; a monitor-side sweep reproduces a bug this project already identified and fixed.
claim = IMPLEMENTED 2026-10-04, checks/cubox.py::OrphanParts. "Orphaned" is not "exists", but the discriminator is the PASS LOCK rather than the two-sample growth this claim assumed, because the worker removes its temp on every path that ends a job -- success renames it to the final artifact (worker.sh:967), failure deletes it (:989). The one deliberate exception is a failed RENAME, which leaves the temp in place and is a real fault. So a `.part` with no pass in flight cannot be a job in progress. Two paths are UNKNOWN rather than graded: flock unavailable (pass_lock=unknown, so the question cannot be asked), and a deliberately stopped unit -- the sweep runs at pass start, so a stop leaves temps behind as a consequence of the stop, and grading that is the permanent-false-alarm shape pass_cadence_min was fixed for on the same day. The count is 0, not the raw file count, while a pass is in flight.

[gap_sources]
metric = gap_sources
unit = sources
direction = low_is_good
green = 0
amber = 1
target = fleet
note = A source no box owns. With both boxes at TOTAL=2 every residue is tiled, so a GAP means the shard arithmetic is wrong or a box is misconfigured -- and it means that file will never be transcoded by anyone. This is scripts/11-transcode-verify.sh's finding made continuous.
claim = PHASE 3 (plan's coverage-verification phase). This is explicitly the fold-in of scripts/11-transcode-verify.sh's logic. Writing it before that script's own gates were re-verified would repeat the project's most expensive mistake: item 72 was this exact check reporting "Coverage is complete" at exit 0 while measuring `done 0 / orphan 18`, with five independent faults each hiding the next. The dashboard must not inherit a coverage verdict that has not first been proven able to fail.

[retired_files]
metric = retired_files
unit = files
direction = low_is_good
green = 0
amber = 3
target = cubox
note = Files at MAX_ATTEMPTS whose OUTPUT IS STILL MISSING. The output test is mandatory, not a refinement: the strike ledger is APPEND-ONLY (skip_bump() is its only writer -- SKIPLIST appears at just three places in worker.sh and never removes an entry), so it keeps the count of a file that later succeeded. Measured 2026-09-26: of cubox-1's four ledger entries, THREE were already published, including the two-attempt one. Counting ledger entries would therefore report retired files that do not exist. When the output tree cannot be read the check is UNKNOWN, never the raw ledger count.

[env_fail_lines]
metric = env_fail_lines
unit = lines
direction = low_is_good
green = 0
amber = 1
target = cubox
window_min = 60
note = ENV-FAIL means the worker refused to act because its environment was wrong (source root not mounted, output not writable, state export gone). It is NOT a content failure and burns no attempt. A burst of these is the signature of a NAS outage, and worker.sh aborts a pass after two. WINDOW=60 min because this is a PER-PASS event and the idle cadence is one pass per 5 min, so the window holds ~12 passes -- if the environment is broken now, this fires many times inside it. Measured on cubox-1's real log 2026-09-26: the tail spans 3 days and holds 2 ENV-FAILs (09-23 and 09-25), both long over; an UNWINDOWED count would report a NAS outage forever, which is the permanent-false-FAIL shape item 72 forbids.

[deadlock_kills]
metric = deadlock_kills
unit = jobs
direction = low_is_good
green = 0
amber = 1
target = cubox
window_min = 360
note = The item-52 VPU encoder deadlock, killed by the worker's own stall_watch() after 300 s of a frozen frame counter (worker.sh:646). This gets its OWN row, separate from generic job failures, because it is the fleet's known hardware-level hazard and the one fault where the cause matters more than the count. WINDOW=360 min because a failure here is a PER-JOB event: jobs run ~90 min and a pass can run 20 h, so a 60-min window would hide a cluster from a few hours earlier -- a false NEGATIVE, which is the more dangerous direction. Measured 2026-09-26: 0 stalls in the window; the 8 historical kills were all `KILLED at the cap`, a DIFFERENT fault that the worker's own source distinguishes ("NOT the cap", worker.sh:646).

[job_failures]
metric = job_failures
unit = jobs
direction = low_is_good
green = 0
amber = 1
target = cubox
window_min = 360
note = The `FAILED <rel> (attempt N/MAX)` lines -- the file-level outcome, whatever the cause. The evidence records the cause breakdown so a cap kill and a deadlock are never conflated. WINDOW=360 for the same per-job reason as deadlock_kills. Measured 2026-09-26: 8 failures over the 3-day tail, and they are NOT 8 distinct files -- Futurama_2026-09-19_10-30.ts appears twice, i.e. a file being retried, which is the strike mechanism doing its job. This is also the only way to see a file approaching MAX_ATTEMPTS before it is retired.

[log_parse_failures]
metric = log_parse_failures
unit = lines
direction = low_is_good
green = 0
amber = 0
target = cubox
note = THE MONITOR WATCHING ITS OWN BLINDNESS. Counts worker-log lines whose SHAPE the parser has never seen (known-benign lines are counted separately in `known_ignored`, so this is not inflated by noise). Non-zero means worker.sh's log format drifted, and the consequence is not cosmetic: every regex that no longer matches reports a STRUCTURAL ZERO, so verify/failed/published/deadlock checks all read green over a box nobody can see. This is not hypothetical -- writing this parser against the real log found the line-prefix regex swallowing the two-space indent on `  verify:` and `  FAILED`, which silently zeroed five counters (verify_ok, verify_stalled, verify_cap, failed, published). Amber equals green because a single unrecognised line is already a defect: any count above zero means at least one message shape is unread.
