# Platform/meta thresholds -- currently NO sections.
#
# THRESHOLDS LIVE WITH THEIR MODULE. Every fleet threshold moved to
# app/modules/fleet/thresholds.conf when modules became the unit of ownership:
# a module declares its threshold file (`Module(threshold_file=...)`) and
# `thresholds.load_many()` merges them, refusing two modules that claim the
# same spec id. The merge is the check a single file could not do, and it is
# why the reasoning comments travelled with their sections rather than staying
# here.
#
# THIS FILE IS STILL LOADED, AND AN EMPTY ONE IS VALID. `Config.checks_conf`
# points here (`MONITOR_CHECKS`), and `thresholds.load()` returns no specs for
# a comment-only file -- configparser simply sees zero sections. That is the
# correct state, not a stub to be filled: a threshold belongs here only if it
# grades the monitor itself rather than some module.
#
# THE ONE PLATFORM CHECK THAT READS THRESHOLDS OWNS NO SECTION. `SpecCoverage`
# is `spec = None` deliberately -- it audits the merged spec set instead of
# being graded against one, so it must not appear below. Platform/meta specs
# (a self-check with a real boundary) would go here, in the same INI format:
# see the file header in app/modules/fleet/thresholds.conf for the keys and
# the strict-at-load validation rule, and app/thresholds.py for why INI
# rather than YAML.
