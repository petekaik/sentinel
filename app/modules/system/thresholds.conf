# System-resource thresholds -- the host the monitor runs on.
#
# THRESHOLDS ARE DATA. Editing this file and restarting the container changes
# the bands; nothing here requires a rebuild. The format and its strict
# load-time validation are described in app/thresholds.py.
#
# `target = local` because these are the monitor container's own host, not a
# fleet box. A host without the figure in question (no thermal zone, no mdstat)
# reports UNKNOWN with the reason in words -- never green, never a threshold.

[system_load1_per_cpu]
metric = system_load1_per_cpu
unit = load
direction = low_is_good
green = 1.0
amber = 2.0
target = local
note = Load average NORMALISED BY CPU COUNT: a load of 4 on one core and a load of 4 on eight are different situations, and an absolute load threshold would be a threshold on the machine's core count. green=1.0 means every CPU has roughly one runnable task (a full queue, not a fault); amber=2.0 means tasks are queuing faster than they are served. Low is good, so the direction is low_is_good. The loads are per-epoch readings of /proc/loadavg, and a missing or unreadable file is UNKNOWN rather than 0.

[system_mem_available_mb]
metric = system_mem_available_mb
unit = MB
direction = high_is_good
green = 512
amber = 256
target = local
note = MemAvailable is the kernel's estimate of memory a new workload can claim without swapping. 512 MB green / 256 MB amber on a 2 GB host: below amber the OOM killer is close and its first victims are the container's own processes, the store writer and the dashboard. The pre-3.14 fallback (MemFree+Buffers+Cached) OVERSTATES availability, so the check carries which formula produced the number in its evidence. A host with no readable meminfo is UNKNOWN, never 0 MB.

[system_disk_free_pct]
metric = system_disk_free_pct
unit = percent
direction = high_is_good
green = 10
amber = 5
target = local
note = Free space as a percentage of the mount's total, graded on the WORST mount in SYSTEM_MOUNTS and named by that mount. 10% green / 5% amber: a full volume does not degrade gracefully -- SQLite writes and the container's own logs fail at once, and a mount with no space left turns every later check UNKNOWN. A percentage rather than bytes because the mounts differ in size and have different reasons to grow. A mount that cannot be stat'ed is named in the detail; if no mount can be read the check is UNKNOWN.

[system_uptime_h]
metric = system_uptime_h
unit = h
direction = high_is_good
green = 0
amber = 0
target = local
note = NOT A HEALTH BOUND. Uptime is an informational reading; no number of hours is good or bad in itself. This section exists because the dashboard routes an informational check to the uncounted section ONLY when the check names a spec -- a spec-less informational check falls into `others` and is counted as a coloured verdict. green = amber = 0 is satisfied by every possible uptime and is never displayed as a colour. Do not tune it and do not attach a remedy to it.

[system_thermal_c]
metric = system_thermal_c
unit = C
direction = low_is_good
green = 80
amber = 90
target = local
note = The hottest zone under /sys/class/thermal, in degrees C (the kernel reports millidegrees). 80 C green / 90 C amber is a generic host bound, not the fanless-CuBox FYI ruling: a host that exposes a thermal zone is telling the operator something actionable, and sustained amber means investigate airflow or load. A host with NO thermal zone (a VM, or a board without the sensor driver) reports UNKNOWN with the reason -- never green, because green would claim a temperature nobody measured.
