# Network-device thresholds -- SNMP devices, graded by per-device settings.
#
# Deliberately EMPTY for now. The loader requires the file to exist beside the
# module (`thresholds.spec_mapping`), and a comment-only file is a valid one:
# configparser sees no sections, so this module claims no spec ids and cannot
# collide with the fleet's or the system's.
#
# The SNMP checks do not grade against file thresholds at all: a device's OID
# rows carry their own unit/direction/green/amber in `SNMP_CHECKS`, and each
# check registers its spec in `ctx.dynamic_specs` (see `Module.check_instances`).
# Adding file specs later is still possible; they would be merged with the
# others and are the only ones an approval can override.
